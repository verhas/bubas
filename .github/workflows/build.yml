# Builds and tests on every push and pull request.
#
# `verify` rather than `test`: it runs the same phases a release does short of signing and
# deploying, so a change that breaks packaging is caught here rather than during a release.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # The sample export is written by the test run. Keeping it lets anyone read a concrete
      # vocabulary without building the project themselves.
      - name: Upload the sample vocabulary export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary
          path: |
            bubas-test/target/vocabulary.md
            bubas-test/target/vocabulary.json
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
