# Builds and tests on every push and pull request.
#
# Releases are made locally, deliberately: the signing key exists on one machine and a local
# backup, and nothing here can sign. What this can do is prove the release would have worked —
# so `-P release verify` with signing skipped runs the tests *and* attaches the sources and
# javadoc jars Maven Central demands. A release that would fail on a malformed javadoc comment
# or a module that packages badly fails here instead, on the push that caused it.
#
# One command rather than two: `verify` under the release profile already runs everything a plain
# `verify` would, so running both would only double the build.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test, and rehearse the release
        run: mvn -B --no-transfer-progress -P release verify -Dgpg.skip=true

      # The sample export is written by the test run. Keeping it lets anyone read a concrete
      # vocabulary without building the project themselves.
      - name: Upload the sample vocabulary export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary
          path: |
            bubas-test/target/vocabulary.md
            bubas-test/target/vocabulary.json
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
